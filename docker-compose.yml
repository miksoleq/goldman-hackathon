services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alerting}
      POSTGRES_USER: ${POSTGRES_USER:-alerting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 2s
      retries: 30

  script-runner:
    build: ./script-runner
    networks: [script-isolation]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    user: nobody
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: "0.5"
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 32
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  control:
    networks: [default, script-isolation]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: control
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      NOTIFICATIONS_SMS_URL: ${NOTIFICATIONS_SMS_URL:-http://sms-mock:8080/messages}
      SMS_AUTHORIZATION: ${SMS_AUTHORIZATION:-}
      RULES_REDIS_CHANNEL: ${RULES_REDIS_CHANNEL:-rules.created.v1}
      RULES_REDIS_ENABLED: ${RULES_REDIS_ENABLED:-true}
      REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-alerting}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-alerting}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      script-runner:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  sms-mock:
    image: python:3.13-alpine
    command: ["python", "/app/server.py"]
    ports:
      - "127.0.0.1:${SMS_MOCK_PORT:-8084}:8080"
    volumes:
      - ./scripts/sms-mock/server.py:/app/server.py:ro
      - sms_data:/data

  workflow-demo:
    image: python:3.13-alpine
    command: ["python", "/app/server.py"]
    volumes:
      - ./scripts/workflow-demo/server.py:/app/server.py:ro
      - workflow_demo_data:/data

  frontend:
    build:
      context: ./frontend
      additional_contexts:
        webshared: ./web-shared
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      control:
        condition: service_started

  control-panel:
    build:
      context: ./control-panel
      additional_contexts:
        webshared: ./web-shared
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${CONTROL_PANEL_PORT:-8083}:80"
    depends_on:
      control:
        condition: service_started
      engine-lb:
        condition: service_started

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: engine
    expose:
      - "8081"
    deploy:
      replicas: ${ENGINE_REPLICAS:-3}
    environment:
      REDIS_HOST: redis
      INGEST_KAFKA_ENABLED: ${INGEST_KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-engine}
      KAFKA_LISTENER_CONCURRENCY: ${KAFKA_LISTENER_CONCURRENCY:-1}
      RULES_REDIS_ENABLED: ${RULES_REDIS_ENABLED:-true}
      RULES_REDIS_CHANNEL: ${RULES_REDIS_CHANNEL:-rules.created.v1}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  engine-lb:
    image: haproxy:3.2-alpine
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8081}:8081"
    volumes:
      - ./deploy/haproxy-engine.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      engine:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.0
    profiles: [kafka]
    ports:
      - "9092:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-6}
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  backend-tests:
    image: maven:3.9-eclipse-temurin-21
    profiles: [test]
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      - maven_cache:/root/.m2
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-alerting}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-alerting}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["mvn", "-B", "-pl", "control,engine", "-am", "clean", "verify"]

networks:
  script-isolation:
    internal: true

volumes:
  sms_data:
  redis_data:
  postgres_data:
  maven_cache:
  workflow_demo_data:
