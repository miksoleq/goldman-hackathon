services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  control:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFICATIONS_SMS_URL: http://sms-mock:8080/messages
      SMS_AUTHORIZATION: ""
    ports: !override ["127.0.0.1:${E2E_CONTROL_PORT}:8082"]
  engine:
    ports: !override ["127.0.0.1:${E2E_ENGINE_PORT}:8081"]
  frontend:
    ports: !override ["127.0.0.1:${E2E_MONITOR_PORT}:80"]
  control-panel:
    ports: !override ["127.0.0.1:${E2E_PANEL_PORT}:80"]
