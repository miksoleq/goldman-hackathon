server:
  servlet:
    session:
      timeout: 8h
      tracking-modes: cookie
      cookie:
        name: ALERT_SESSION
        http-only: true
        same-site: strict
  port: ${SERVER_PORT:8082}

spring:
  task:
    scheduling:
      pool:
        size: 3
  application:
    name: control
  jooq:
    sql-dialect: POSTGRES
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/alerting}
    username: ${SPRING_DATASOURCE_USERNAME:alerting}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

rules:
  redis:
    enabled: ${RULES_REDIS_ENABLED:false}
    channel: ${RULES_REDIS_CHANNEL:rules.created.v1}
