server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: control
  kafka:
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  jooq:
    sql-dialect: POSTGRES
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/alerting}
    username: ${SPRING_DATASOURCE_USERNAME:alerting}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

rules:
  kafka:
    enabled: ${RULES_KAFKA_ENABLED:false}
    topic: ${RULES_KAFKA_TOPIC:rules.created.v1}

alerts:
  kafka:
    enabled: ${ALERTS_KAFKA_ENABLED:false}
    topic: ${ALERTS_KAFKA_TOPIC:alerts.live}
    group: ${ALERTS_KAFKA_GROUP:control-alerts-live-v1}
