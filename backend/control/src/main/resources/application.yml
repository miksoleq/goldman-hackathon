server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: control
  jooq:
    sql-dialect: POSTGRES
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/alerting}
    username: ${SPRING_DATASOURCE_USERNAME:alerting}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

rules:
  kafka:
    enabled: ${RULES_KAFKA_ENABLED:false}
    topic: ${RULES_KAFKA_TOPIC:rules.created.v1}
