server:
  port: ${SERVER_PORT:8081}

spring:
  jackson:
    deserialization:
      use-big-decimal-for-floats: true
    datatype:
      json-node:
        strip-trailing-bigdecimal-zeroes: false
  application:
    name: engine
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:engine}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

ingest:
  file:
    enabled: ${INGEST_FILE_ENABLED:false}
    path: ${INGEST_FILE_PATH:}
    poll-interval-ms: ${INGEST_FILE_POLL_INTERVAL_MS:250}
  max-payload-bytes: ${INGEST_MAX_PAYLOAD_BYTES:1048576}
  redis:
    enabled: ${INGEST_REDIS_ENABLED:true}
    external-stream: ${INGEST_REDIS_EXTERNAL_STREAM:ingest:external}
    internal-stream: ${INGEST_REDIS_INTERNAL_STREAM:events:ingest}
    consumer-group: ${INGEST_REDIS_CONSUMER_GROUP:engine}
    consumer-name: ${INSTANCE_ID:${random.uuid}}
    batch-size: ${INGEST_REDIS_BATCH_SIZE:100}
    max-batches-per-poll: ${INGEST_REDIS_MAX_BATCHES_PER_POLL:10}
    poll-interval-ms: ${INGEST_REDIS_POLL_INTERVAL_MS:250}
  kafka:
    enabled: ${INGEST_KAFKA_ENABLED:false}
    topic: ${INGEST_KAFKA_TOPIC:ingest.external}

rules:
  redis:
    enabled: ${RULES_REDIS_ENABLED:false}
    channel: ${RULES_REDIS_CHANNEL:rules.created.v1}
