global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend engine_http
    bind :8081
    default_backend engine_replicas

backend engine_replicas
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    default-server inter 2s fall 2 rise 1
    server-template engine 1-32 engine:8081 check resolvers docker init-addr libc,none
